<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0B1A2E;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, serif;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .brand {
      color: #C9A03D;
      font-size: 22px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 0.4s ease forwards;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(201,160,61,0.2);
      border-top-color: #C9A03D;
      border-radius: 50%;
      animation: spin 0.8s linear infinite, fadeIn 0.4s 0.2s ease forwards;
      opacity: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="brand">Fers Innova</div>
    <div class="spinner"></div>
  </div>

  <script>
    fetch('/api/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        event_name: 'Lead',
        event_time: Math.floor(Date.now() / 1000),
        user_agent: navigator.userAgent,
        referrer: document.referrer
      })
    }).catch(() => {}).finally(() => {
      setTimeout(() => {
        window.location.href = 'https://chat.whatsapp.com/DdjjarQyUNtAXRRQlzke3A';
      }, 800);
    });
  </script>
</body>
